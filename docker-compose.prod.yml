services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    restart: always
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_TIMEZONE: Asia/Bangkok
      APP_LOCALE: th
    volumes:
      - app_storage:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [clinic]
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod
    restart: always
    ports:
      - "80:80"
    volumes:
      - app_storage:/var/www/storage:ro
      - ./docker/nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [clinic]
  mysql:
    image: mysql:8.0
    restart: always
    env_file: .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Bangkok
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${DB_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [clinic]
  redis:
    image: redis:7-alpine
    restart: always
    volumes: [redis_prod_data:/data]
    networks: [clinic]
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    restart: always
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_TIMEZONE: Asia/Bangkok
      APP_LOCALE: th
    command: ["sh", "-c", "while true; do php artisan schedule:run; sleep 60; done"]
    depends_on: [app]
    networks: [clinic]
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    restart: always
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_TIMEZONE: Asia/Bangkok
      APP_LOCALE: th
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    depends_on: [app]
    networks: [clinic]
networks:
  clinic: {}
volumes:
  mysql_data: {}
  redis_prod_data: {}
  app_storage: {}
